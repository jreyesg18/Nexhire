services:
  app:
    build: .
    container_name: nexhire_app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - RAILS_ENV=production
      - DATABASE_URL=postgresql://nexhire_user:${DB_PASSWORD}@db:5432/nexhire
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexhire_net

  db:
    image: postgres:16-alpine
    container_name: nexhire_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nexhire
      - POSTGRES_USER=nexhire_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - nexhire_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexhire_user -d nexhire"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexhire_net

volumes:
  nexhire_db_data:

networks:
  nexhire_net:
    external: true
